name: Actualización Automática del Dashboard #queremostrabajar

on:
  schedule:
    # Se ejecuta automáticamente cada 4 horas
    - cron: '0 */4 * * *'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions en GitHub

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias y yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo wget https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Ejecutar Pipeline de Scraping y Analítica
        run: |
          python main.py

      - name: Commitear y Pushear Cambios Actualizados
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/ reports/ index.html CONTEXT.md
          if git diff --staged --quiet; then
            echo "No se detectaron nuevas publicaciones o cambios en las métricas."
          else
            git commit -m "chore(auto): actualización de métricas y dashboard #queremostrabajar"
            git push
          fi

